name: Isolated Home Assistant integration tests

on:
  push:
    branches:
      - dev/evcc-simulator
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homeassistant-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: qa_ha/requirements.txt
      - name: Install Home Assistant and its test fixtures
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qa_ha/requirements.txt
      - name: Run in-process HA integration tests
        run: python -c "import homeassistant; import pytest; raise SystemExit(pytest.main(['-q', 'qa_ha', '--disable-warnings']))"
